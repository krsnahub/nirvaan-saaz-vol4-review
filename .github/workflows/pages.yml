name: Publish temporary review
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Assemble temporary listening copies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download review-media-20261020 --repo "$GITHUB_REPOSITORY" --pattern nirvaan-ruh-preview-media.tar.gz
          sha256sum -c media.sha256
          mkdir site
          cp index.html app.js style.css site/
          tar -xzf nirvaan-ruh-preview-media.tar.gz -C site
          test -f site/album.json
          test "$(find site/audio -name '*.mp3' | wc -l)" -eq 13
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 1
      - uses: actions/deploy-pages@v4
        id: deployment
